  - {name: "NDTV", category: "top",   url: "https://feeds.feedburner.com/ndtvnews-top-stories", enabled: true}
  - {name: "NDTV", category: "india", url: "https://feeds.feedburner.com/ndtvnews-india-news", enabled: true}
  - {name: "NDTV", category: "world", url: "https://feeds.feedburner.com/ndtvnews-world-news", enabled: true}

  # ---------------- Hindustan Times ----------------
  - {name: "Hindustan Times", category: "india",    url: "https://www.hindustantimes.com/feeds/rss/india-news/rssfeed.xml", enabled: true}
  - {name: "Hindustan Times", category: "world",    url: "https://www.hindustantimes.com/feeds/rss/world-news/rssfeed.xml", enabled: true}
  - {name: "Hindustan Times", category: "business", url: "https://www.hindustantimes.com/feeds/rss/business/rssfeed.xml", enabled: true}

