  - {name: "News18",         category: "india",    url: "https://www.news18.com/commonfeeds/v1/eng/rss/india.xml", enabled: true}
  - {name: "Firstpost",      category: "india",    url: "https://www.firstpost.com/commonfeeds/v1/mfp/rss/india.xml", enabled: true}

# ----------------------------------------------------------------------
data_ingestion:
  destination_folder: "data/raw"
  file_name: "indian_news.json"

  # --- networking ---
  timeout: 20                 # seconds per request
  retries: 3                  # automatic retries on 429/5xx/connection errors
  backoff: 1.0                # wait 1s, 2s, 4s ... between retries
  max_workers: 8              # feeds / pages fetched in parallel
  user_agent: "Mozilla/5.0 (compatible; LiveNewsSentimentProject/1.0)"

  # --- data quality ---
  max_description_chars: 1000 # trim very long summaries
  merge_with_existing: true   # append to the old file instead of overwriting it
  max_articles_kept: 20000    # keep newest N articles after merging

  # Some feeds (e.g. Indian Express) give no summary. When true, the article
  # page is opened and its meta description is used instead.
  fetch_missing_description: true
  max_description_fetches: 200   # per run, newest articles first

# ----------------------------------------------------------------------
data_cleaning:
  input_file: "data/raw/indian_news.json"
  output_folder: "data/processed"
  output_json: "indian_news_clean.json"
  output_csv: "indian_news_clean.csv"
  report_file: "cleaning_report.json"
  save_csv: true

  # --- text cleaning ---
  remove_urls: true
  remove_emojis: true
  normalize_quotes: true      # curly quotes/dashes -> plain ASCII
  lowercase: false            # keep false for transformer/VADER sentiment models

  # --- filtering ---
  min_text_words: 4           # drop articles with fewer words (title + description)
  drop_duplicate_titles: true
  english_only: true
  max_non_latin_ratio: 0.3    # drop if more than 30% of letters are non-Latin

  # Regex patterns removed from the END of titles (case-insensitive)
  title_suffix_patterns:
    - '\s*\|\s*(Explained|Watch|Watch Video|Video|Photos?|In Pictures|Live Updates|Live)\s*$'
    - '\s*[|-]\s*(The Hindu|The Indian Express|Indian Express|Times of India|NDTV|Hindustan Times|Mint|News18|Firstpost)\s*$'

# ----------------------------------------------------------------------
flask_app:
  host: "127.0.0.1"
  port: 5000
  debug: true
  per_page: 12                       # news cards per page
  similar_count: 3                   # similar-news cards on the article page
  similar_min_score: 0.0             # 0 = always show the 3 closest. With MiniLM, ~0.4 hides weak matches
  # Override with the SECRET_KEY environment variable in real use
  secret_key: "change-this-secret-key"
  # Demo login. Password for "admin" is: news123  (change it!)
  # Make a new hash with:
  #   python -c "from werkzeug.security import generate_password_hash as g; print(g('your-password'))"
  users:
    - username: "admin"
      password_hash: "scrypt:32768:8:1$9cT8wPJtYOipcO1u$34d89522342e8e80b475fa14308b9b673290e732137dae9b672e7701f2ff494cdd7e8007a8dbd69cf024c5dcd8369ddfdccbdaf2fe92b0fae874be1e864de77b"

# ----------------------------------------------------------------------
data_preprocessing:
  input_file: "data/processed/indian_news_clean.json"   # output of the cleaning stage
  output_folder: "data/processed"
  output_json: "indian_news_vectorized.json"   # clean news + processed text + "vector"
  vectors_file: "indian_news_vectors.npz"      # same vectors as a numpy matrix (+ ids) for similarity search
  report_file: "preprocessing_report.json"

  text_field: "text"                    # title + description, built by the cleaning stage
  vector_field: "vector"                # field appended to each article
  store_processed_text: true            # also append the stop-word-free text that was embedded
  processed_text_field: "text_processed"
  decimals: 4                           # round vector values to keep the JSON small
  reuse_existing_vectors: true          # on re-runs only embed new/changed articles (fast)

  # ---- stop words ----
  stopwords:
    remove: true
    # Words taken OUT of the stop-word list because they change the meaning of a
    # headline ("no toilets", "not attend", "against the move", "after the verdict").
    # Keep every word in quotes: unquoted no / off / on / yes are read by YAML as true/false.
    keep_words: ["no", "nor", "not", "never", "none", "against", "after", "before", "over",
                 "under", "above", "below", "between", "off", "up", "down", "out", "more",
                 "most", "only", "all"]
    extra_words: []                     # additional words to remove, e.g. ["says", "said"]

  # ---- named entities (people, places, organisations) ----
  # Removing stop words can damage names: "WHO" and "IT" disappear,
  # "The Hindu" -> "Hindu", "Bank of India" -> "Bank India".
  # With keep: true, stop words that are part of a name are NOT removed.
  # NOTE: keep data_cleaning.lowercase = false, capital letters are how names are found.
  # (Texts written in ALL CAPS are left untouched, since names cannot be told apart there.)
  named_entities:
    keep: true
    method: "heuristic"                 # "heuristic" (no download) or "spacy" (more accurate)
    spacy_model: "en_core_web_sm"       # pip install spacy && python -m spacy download en_core_web_sm
    spacy_labels: [PERSON, ORG, GPE, LOC, NORP, FAC, EVENT, LAW, PRODUCT, WORK_OF_ART]

  # ---- embeddings ----
  embedding:
    model_name: "sentence-transformers/all-MiniLM-L6-v2"   # 384-dimensional vectors
    batch_size: 64
    normalize: true                     # unit-length vectors: cosine similarity = dot product
