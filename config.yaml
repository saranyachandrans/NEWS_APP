  - {name: "Indian Express", category: "sports",        url: "https://indianexpress.com/section/sports/feed/", enabled: true}
  - {name: "Indian Express", category: "technology",    url: "https://indianexpress.com/section/technology/feed/", enabled: true}
  - {name: "Indian Express", category: "entertainment", url: "https://indianexpress.com/section/entertainment/feed/", enabled: true}

  # ---------------- Times of India ----------------
  - {name: "Times of India", category: "top",      url: "https://timesofindia.indiatimes.com/rssfeedstopstories.cms", enabled: true}
  - {name: "Times of India", category: "india",    url: "https://timesofindia.indiatimes.com/rssfeeds/-2128936835.cms", enabled: true}
  - {name: "Times of India", category: "business", url: "https://timesofindia.indiatimes.com/rssfeeds/1898055.cms", enabled: true}
